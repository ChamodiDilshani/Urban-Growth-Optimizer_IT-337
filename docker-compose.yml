version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: urbanscapes_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  python-engine:
    build:
      context: .
      dockerfile: python_service/Dockerfile
    container_name: urbanscapes_python
    ports:
      - "5001:5001"
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: urbanscapes_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/urbanscapes
      - PYTHON_SERVICE_URL=http://python-engine:5001
    depends_on:
      - mongodb
      - python-engine
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: urbanscapes_client
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
